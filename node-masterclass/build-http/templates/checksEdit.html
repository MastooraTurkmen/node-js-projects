<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Create A Check</h1>
    <h2>Your check will run once per minute</h2>
    <a class="backButton" href="/chocks/all">Back</a>
    <hr />
    <div class="formWrapper">

        <form id="checksCreate" action="/api/checks" method="POST">

            <div class="formError"></div>
            <div class="inputWrapper">
                <div class="inputLabel">Protocol</div>
                <select name="protocol">
                    <option value="http" selected>http://</option>
                    <option value="https">https://</option>
                </select>
            </div>
            <div class="inputWrapper">
                <div class="inputLabel">URL (not including protocol)</div>
                <input type="text" name="url" placeholder="mywebsite.com/my/path">
            </div>
            <div class="inputWrapper">
                <div class="inputLabel">Success Codes (HTTP codes that should represent "up")</div>
                <div class="checkboxGroup">
                    <input type="checkbox" class="multiselect intval" name="successCodes" value="200" checked>200
                    <input type="checkbox" class="multiselect intval" name="successCodes" value="200" checked>201
                    <input type="checkbox" class="multiselect intval" name="successCodes" value="301">
                    <input type="checkbox" class="multiselect intval" name="successCodes" value="400">
                    <input type="checkbox" class="multiselect intval" name="successCodes" value="403">
                    <input type="checkbox" class="multiselect intval" name="successCodes" value="500">
                </div>
            </div>
            <div class="inputWrapper">
                <div class="inputLabel">HTTP Method</div>
                <select name="httpmethod">
                    <option value="get" selected>GET</option>
                    <option value="post">POST</option>
                    <option value="put">PUT</option>
                    <option value="delete">DELETE</option>
                </select>
            </div>
            <div class="inputWrapper">
                <div class="inputLabel">Timeout (seconds)</div>
                <input type="number" name="timeoutSeconds" min="1" max="5" value="1">
            </div>
        </form>
    </div>
</body>

</html>
